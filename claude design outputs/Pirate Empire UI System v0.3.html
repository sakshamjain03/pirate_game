document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

yToHud{0%{transform:translate(0,0) scale(1)}100%{transform:translate(-330px,-200px) scale(.25);opacity:.2}}\n@keyframes flash{0%{opacity:1}100%{opacity:0}}\n@keyframes ignite{0%{box-shadow:0 0 0 0 rgba(255,217,122,0);transform:scale(.8)}60%{box-shadow:0 0 40px 14px rgba(255,217,122,.9);transform:scale(1.25)}100%{box-shadow:0 0 22px 6px rgba(255,217,122,.7);transform:scale(1.1)}}\n@keyframes vignette{0%,100%{opacity:.55}50%{opacity:1}}\n@keyframes slideIn{0%{transform:translateX(420px) rotate(18deg)}70%{transform:translateX(-10px) rotate(-5deg)}100%{transform:translateX(0) rotate(-3deg)}}\n@keyframes fillBar{0%{width:0}100%{width:100%}}\n@keyframes spark{0%{transform:scale(0);opacity:1}100%{transform:scale(1.6);opacity:0}}\n@keyframes fall{0%{transform:translateY(-40px) rotate(0);opacity:0}10%{opacity:1}100%{transform:translateY(420px) rotate(540deg);opacity:.8}}\n@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<section id=\"intro\" style=\"padding:56px 64px 24px;max-width:1200px\">\n<div style=\"font:600 11px ui-monospace,Menlo,monospace;letter-spacing:2px;color:#b89a6a\">UI SYSTEM · V0.3 · LANDSCAPE · SETTINGS · GAMEPLAY EVENTS<\u002Fdiv>\n<h1 style=\"margin:8px 0 14px;font-family:'Germania One',serif;font-weight:400;font-size:72px;line-height:1;color:#f7dfa6;text-shadow:0 3px 0 #3a1f0c\">Pirate Empire<\u002Fh1>\n<p style=\"margin:0 0 22px;max-width:760px;font-size:18px;line-height:1.5;color:#d9c4a0;text-wrap:pretty\">Epic world, funny furniture. Six landscape screens (844×390, phone held horizontally), five Settings pages and the key gameplay moments, all on one set of tokens, followed by a component sheet for the 2D artist and the Godot engineer.<\u002Fp>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;max-width:1100px\">\n<div style=\"padding:14px 16px;border-radius:10px;background:#221811;border:1px solid #3a2a1c;color:#cdb690;font-size:14px;line-height:1.45\"><b style=\"color:#f2c66d\">v0.3: landscape.<\u002Fb> The world owns the centre, detail panels dock to the right edge and the primary action sits under the right thumb. Game data matches v0.2; visual language is unchanged.<\u002Fdiv>\n<div style=\"padding:14px 16px;border-radius:10px;background:#221811;border:1px solid #3a2a1c;color:#cdb690;font-size:14px;line-height:1.45\"><b style=\"color:#f2c66d\">Chrome is real, art is slotted.<\u002Fb> Wood, brass, parchment, gems, icons and buttons are rendered to lock intent. Painted illustration (islands, ships, captains, chest, parrot) sits in hatched <span style=\"font-family:ui-monospace,monospace;font-size:12px;color:#f7dfa6\">ART<\u002Fspan> slots with a brief for each.<\u002Fdiv>\n<div style=\"padding:14px 16px;border-radius:10px;background:#221811;border:1px solid #3a2a1c;color:#cdb690;font-size:14px;line-height:1.45\"><b style=\"color:#f2c66d\">Try it.<\u002Fb> Press any button (4px depress). Tap island tiles, roster cards, the chest, Higgins' Next, every settings control, and the Replay buttons on events. Cyan tags mark motion cues. Tweaks: cues, loot rarity, notoriety value.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"screens\" style=\"padding:32px 64px 56px\">\n<h2 style=\"margin:0 0 6px;font-family:'Germania One',serif;font-weight:400;font-size:40px;color:#f7dfa6\">Screens<\u002Fh2>\n<p style=\"margin:0 0 26px;color:#b89a6a;font-size:15px\">Landscape 844×390. The dark pill on the left edge is the camera cutout; interactive UI keeps 48px clear of both side edges.<\u002Fp>\n<div style=\"display:flex;flex-wrap:wrap;gap:56px 48px;align-items:flex-start\"><div id=\"s1\" style=\"display:flex;flex-direction:column;gap:12px;width:844px\"><div style=\"display:flex;align-items:baseline;gap:10px;color:#cdb690;font-size:14px\"><span style=\"font:700 11px ui-monospace,monospace;padding:3px 7px;border-radius:4px;background:#f2c66d;color:#2a1608\">01<\u002Fspan><b style=\"color:#f7dfa6\">World Map<\u002Fb>fleet route to the selecte ius:50%;border:3px solid #2e1a0c;background:repeating-linear-gradient(178deg,#5b3920 0 2px,#6d452a 2px 7px,#63401f 7px 9px,#7a4e2e 9px 15px);box-shadow:0 1px 0 #24140a,0 3px 6px rgba(0,0,0,.45);transform:translateY(4px);filter:brightness(.85);font:800 11px 'Baloo 2';color:#f7e6c4\">Fleet<\u002Fbutton><\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:12px\"><button style=\"width:58px;height:58px;border-radius:50%;border:3px solid #2e1a0c;background:conic-gradient(rgba(0,0,0,.55) 0 62%,rgba(0,0,0,0) 62%),repeating-linear-gradient(178deg,#5b3920 0 2px,#6d452a 2px 7px,#63401f 7px 9px,#7a4e2e 9px 15px);box-shadow:0 5px 0 #24140a;font:800 11px 'Baloo 2';color:#f7e6c4\">0:07<\u002Fbutton><span style=\"font-size:12px;color:#9a8466\">cooldown = conic sweep, not grey-out<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:20px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px;font-size:13px;line-height:1.5;color:#b89a6a\">\n<div><b style=\"color:#e6d4b0\">Base<\u002Fb><br>Radius 18 (primary), 14 (secondary). Border 3px dark ink of the hue. Lip shadow 6px solid below.<\u002Fdiv>\n<div><b style=\"color:#e6d4b0\">Float<\u002Fb><br>Soft cast shadow 0 12 20 @40% black implies the button sits above parchment/wood.<\u002Fdiv>\n<div><b style=\"color:#e6d4b0\">Press<\u002Fb><br>translateY 4px, lip shrinks 6→2px, brightness 88%. 60ms in, 120ms out with slight overshoot.<\u002Fdiv>\n<div><b style=\"color:#e6d4b0\">Glow<\u002Fb><br>Separate layer behind the button (easy in Godot as a sibling TextureRect), opacity .45→1, scale .96→1.07, 2.2s sine.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"padding:22px 24px;border-radius:14px;background:#211710;border:1px solid #3a2a1c\">\n<div style=\"font-family:'Germania One',serif;font-size:24px;color:#f7dfa6;margin-bottom:16px\">Panel frames<\u002Fdiv>\n<div style=\"display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap\">\n<div style=\"position:relative;width:260px;height:180px\">\n<div style=\"position:absolute;inset:0;background:radial-gradient(ellipse at 25% 15%,#fdf1d2 0%,rgba(253,241,210,0) 55%),radial-gradient(ellipse at 85% 95%,rgba(150,95,40,.4) 0%,rgba(150,95,40,0) 50%),repeating-linear-gradient(8deg,rgba(120,80,30,.05) 0 2px,rgba(0,0,0,0) 2px 7px),#ecd6a4;box-shadow:inset 0 0 28px rgba(110,70,25,.5);clip-path:polygon(0% 3%,6% 0%,14% 2%,22% 0%,31% 1.5%,40% 0%,52% 2%,63% 0%,72% 1.5%,83% 0%,92% 2%,100% 0%,99% 14%,100% 28%,98.8% 42%,100% 56%,99% 70%,100% 84%,99% 94%,100% 100%,90% 98.5%,78% 100%,66% 98%,55% 100%,44% 98.5%,32% 100%,21% 98.2%,10% 100%,0% 98.5%,1% 84%,0% 70%,1.2% 56%,0% 42%,1% 28%,0% 14%)\"><\u002Fdiv>\n<div style=\"position:absolute;left:40px;top:0;bottom:0;border-left:1px dashed #1fb6d8\"><\u002Fdiv><div style=\"position:absolute;right:40px;top:0;bottom:0;border-left:1px dashed #1fb6d8\"><\u002Fdiv><div style=\"position:absolute;top:40px;left:0;right:0;border-top:1px dashed #1fb6d8\"><\u002Fdiv><div style=\"position:absolute;bottom:40px;left:0;right:0;border-top:1px dashed #1fb6d8\"><\u002Fdiv>\n<div style=\"position:absolute;left:50px;top:52px;right:50px;font:700 12px/1.4 'Baloo 2';color:#3a2616;text-align:center\">Parchment · deckled<br><span style=\"font:600 10px ui-monospace,monospace;color:#1a7f96\">9-slice 40/40/40/40<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"position:relative;width:240px;height:180px;padding:4px;border-radius:18px;background:repeating-linear-gradient(45deg,#c8a36a 0 4px,#8a6a3a 4px 8px);box-sizing:border-box\">\n<div style=\"position:relative;height:100%;border-radius:14px;background:radial-gradient(ellipse at 25% 15%,#fdf1d2 0%,rgba(253,241,210,0) 55%),#ecd6a4;box-shadow:inset 0 0 22px rgba(110,70,25,.45)\">\n<span style=\"position:absolute;top:7px;left:7px;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3c4 0,#e2b75a 35%,#8a6224 75%,#4a3210 100%)\"><\u002Fspan><span style=\"position:absolute;top:7px;right:7px;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3c4 0,#e2b75a 35%,#8a6224 75%,#4a3210 100%)\"><\u002Fspan><span style=\"position:absolute;bottom:7px;left:7px;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3c4 0,#e2b75a 35%,#8a6224 75%,#4a3210 100%)\"><\u002Fspan><span style=\"position:absolute;bottom:7px;right:7px;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3c4 0,#e2b75a 35%,#8a6224 75%,#4a3210 100%)\"><\u002Fspan>\n<div style=\"position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font:700 12px/1.4 'Baloo 2';color:#3a2616\">Rope-stitched + brass studs<br><span style=\"font:600 10px ui-monospace,monospace;color:#1a7f96\">rope 4px tile · studs 10px @7px inset<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"position:relative;width:240px;padding:10px 26px 12px;border-radius:10px;border:3px solid #2e1a0c;background:linear-gradient(180deg,rgba(255,215,150,.22),rgba(0,0,0,.25)),repeating-linear-gradient(178deg,#5b3920 0 2px,#6d452a 2px 7px,#63401f 7px 9px,#7a4e2e 9px 15px,#5f3b21 15px 17px);box-shadow:inset 0 2px 0 rgba(255,220,170,.35),0 6px 14px rgba(0,0,0,.45);box-sizing:border-box;text-align:center\">\n<span style=\"position:absolute;top:5px;left:6px;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3c4 0,#e2b75a 35%,#8a6224 75%,#4a3210 100%)\"><\u002Fspan><span style=\"position:absolute;top:5px;right:6px;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3c4 0,#e2b75a 35%,#8a6224 75%,#4a3210 100%)\"><\u002Fspan>\n<div style=\"font-family:'Germania One',serif;font-size:24px;color:#fff1d0;text-shadow:0 2px 0 #2a1608\">Wood plaque<\u002Fdiv><div style=\"font:600 10px ui-monospace,monospace;color:#9fe3f0\">titles only · 3-slice horizontal<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:16px;font-size:13px;line-height:1.5;color:#b89a6a\">Never a flat fill. Parchment = warm top-left highlight, burnt lower-right edge, fibre grain, inset burn 28px. Deckle lives in the texture alpha, so content padding is 16–20px inside the 9-slice margin.<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"padding:22px 24px;border-radius:14px;background:#211710;border:1px solid #3a2a1c\">\n<div style=\"font-family:'Germania One',serif;font-size:24px;color:#f7dfa6;margin-bottom:16px\">Icon style<\u002Fdiv>\n<div style=\"display:flex;gap:22px;align-items:flex-end;flex-wrap:wrap\">\n<div style=\"display:flex;flex-direction:column;align-items:center;gap:8px\"><span style=\"width:48px;height:48px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#fffbe0 0 10%,#ffd75e 28%,#e0a023 62%,#8a5a0c 100%);border:2.5px solid #3e2604;box-shadow:inset -4px -4px 0 rgba(120,70,0,.45),0 4px 4px rgba(0,0,0,.4)\"><\u002Fspan><span style=\"font:700 12px 'Baloo 2';color:#e6d4b0\">Gold<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;align-items:center;gap:8px\"><span style=\"width:38px;height:48px;border-radius:10px/16px;background:linear-gradient(180deg,rgba(0,0,0,0) 20%,#35271a 20% 28%,rgba(0,0,0,0) 28% 72%,#35271a 72% 80%,rgba(0,0,0,0) 80%),repeating-linear-gradient(90deg,rgba(0,0,0,.12) 0 1px,rgba(0,0,0,0) 1px 6px),linear-gradient(90deg,#4f2c14,#9c6436 32%,#c68a50 46%,#7d4b25 78%,#45260f);border:2.5px solid #2a1608;box-shadow:0 4px 4px rgba(0,0,0,.4)\"><\u002Fspan><span style=\"font:700 12px 'Baloo 2';color:#e6d4b0\">Rum<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;align-items:center;gap:8px\"><span style=\"flex:none;width:48px;height:48px;border-radius:50%;background:radial-gradient(circle at 50% 50%,#6b4428 0 8%,#e2b884 9% 22%,#c8955a 23% 34%,#e2b884 35% 48%,#b8834a 49% 60%,#6b4428 61% 72%,#4a2c14 73%);border:2.5px solid #2a1608;box-shadow:inset -2px -3px 0 rgba(0,0,0,.25)\"><\u002Fspan><span style=\"font:700 12px 'Baloo 2';color:#e6d4b0\">Wood<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;align-items:center;gap:8px\"><span style=\"flex:none;display:flex;filter:drop-shadow(1px 0 0 #1a1c20) drop-shadow(-1px 0 0 #1a1c20) drop-shadow(0 1px 0 #1a1c20) drop-shadow(0 -1px 0 #1a1c20)\"><span style=\"width:48px;height:30px;clip-path:polygon(18% 0,82% 0,100% 100%,0 100%);background:linear-gradient(180deg,#f7f9fb 0 12%,#b4bcc6 30%,#6c7480 72%,#3a4048 100%)\"><\u002Fspan><\u002Fspan><span style=\"font:700 12px 'Baloo 2';color:#e6d4b0\">Iron<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;align-items:center;gap:8px\"><span style=\"flex:none;width:46px;height:41px;border-radius:3px;background:radial-gradient(circle at 72% 74%,#2f6fd6 0 13%,rgba(0,0,0,0) 14%),linear-gradient(90deg,#8a6224 0 12%,rgba(0,0,0,0) 12% 88%,#8a6224 88%),repeating-linear-gradient(180deg,rgba(0,0,0,0) 0 9px,rgba(58,38,22,.4) 9px 10px),linear-gradient(180deg,#fbeecb,#dcc08b);border:2.5px solid #3a2616\"><\u002Fspan><span style=\"font:700 12px 'Baloo 2';color:#e6d4b0\">Research<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;align-items:center;gap:8px\"><span style=\"width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#ffffff 0 8%,#7a7f88 16%,#2a2d33 55%,#0c0d10 100%);border:2.5px solid #000;box-shadow:0 4px 4px rgba(0,0,0,.4)\"><\u002Fspan><span style=\"font:700 12px 'Baloo 2';color:#e6d4b0\">Cannonball<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;align-items:center;gap:8px;padding-left:10px;border-left:1px solid #3a2a1c\"><div style=\"display:flex;gap:8px;align-items:center\"><span style=\"width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#fffbe0 0 10%,#ffd75e 28%,#e0a023 62%,#8a5a0c 100%);border:1.5px solid #3e2604\"><\u002Fspan><span style=\"width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#fffbe0 0 10%,#ffd75e 28%,#e0a023 62%,#8a5a0c 100%);border:1px solid #3e2604\"><\u002Fspan><\u002Fdiv><span style=\"font:700 12px 'Baloo 2';color:#e6d4b0\">24 / 16<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:16px;font-size:13px;line-height:1.5;color:#b89a6a\">Five resources, no premium currency. Light from upper-left: specular dot at 30/30%, core shadow lower-right. Outline 2.5px at 48, 1.5px at 24, colour = darkest tone of the object (never pure black except iron). Painted texture (grain, hoops, rim ridges) drops out below 24px.<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"padding:22px 24px;border-radius:14px;background:#211710;border:1px solid #3a2a1c\">\n<div style=\"font-family:'Germania One',serif;font-size:24px;color:#f7dfa6;margin-bottom:14px\">Typography<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:10px\">\n<div style=\"display:flex;align-items:baseline;gap:14px\"><span style=\"width:110px;flex:none;font:600 11px ui-monospace,monospace;color:#9a8466\">Display 44<\u002Fspan><span style=\"font-family:'Germania One',serif;font-size:44px;line-height:1;color:#fff1d0;text-shadow:0 3px 0 #2a1608\">Legendary Haul!<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;align-items:baseline;gap:14px\"><span style=\"width:110px;flex:none;font:600 11px ui-monospace,monospace;color:#9a8466\">Title 26–32<\u002Fspan><span style=\"font-family:'Germania One',serif;font-size:28px;color:#f7dfa6\">Captain's Roster<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;align-items:baseline;gap:14px\"><span style=\"width:110px;flex:none;font:600 11px ui-monospace,monospace;color:#9a8466\">HUD num 15–20<\u002Fspan><span style=\"font:800 20px 'Baloo 2';color:#fff4d6\">24,860 · 312<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;align-items:baseline;gap:14px\"><span style=\"width:110px;flex:none;font:600 11px ui-monospace,monospace;color:#9a8466\">Body 14–17<\u002Fspan><span style=\"font:600 16px/1.4 'Baloo 2';color:#e6d4b0\">Rum keeps the crew from asking where the gold went.<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;align-items:baseline;gap:14px\"><span style=\"width:110px;flex:none;font:600 11px ui-monospace,monospace;color:#9a8466\">Chip 11–13<\u002Fspan><span style=\"font:800 12px 'Baloo 2';color:#ffb199\">DMG 412<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:14px;font-size:13px;line-height:1.5;color:#b89a6a\">Germania One for headers and CTA labels, always with a 2px ink drop so it survives busy art. Baloo 2 (600–800) for everything numeric. Stand-ins: swap for a licensed hand-lettered face later without changing sizes.<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"padding:22px 24px;border-radius:14px;background:#211710;border:1px solid #3a2a1c\">\n<div style=\"font-family:'Germania One',serif;font-size:24px;color:#f7dfa6;margin-bottom:14px\">Motion cues<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1.3fr 1fr 1.4fr;gap:0;font-size:13px\">\n<sc-for list=\"{{ motion }}\" as=\"m\" hint-placeholder-count=\"8\">\n<div style=\"padding:7px 0;border-top:1px solid #3a2a1c;color:#e6d4b0;font-weight:700\">{{ m.a }}<\u002Fdiv>\n<div style=\"padding:7px 0;border-top:1px solid #3a2a1c;color:#9fe3f0;font-family:ui-monospace,monospace;font-size:12px\">{{ m.b }}<\u002Fdiv>\n<div style=\"padding:7px 0;border-top:1px solid #3a2a1c;color:#b89a6a\">{{ m.c }}<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"padding:22px 24px;border-radius:14px;background:#211710;border:1px solid #3a2a1c;grid-column:1 / -1\">\n<div style=\"font-family:'Germania One',serif;font-size:24px;color:#f7dfa6;margin-bottom:16px\">Settings controls<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:20px\">\n<div style=\"display:flex;flex-direction:column;gap:10px\"><div style=\"font:700 13px 'Baloo 2';color:#e6d4b0\">Toggle<\u002Fdiv><div style=\"padding:14px;border-radius:10px;background:#ecd6a4;box-shadow:inset 0 0 18px rgba(110,70,25,.4);min-height:44px;display:flex;align-items:center;gap:10px;flex-wrap:wrap\"><div style=\"position:relative;width:62px;height:30px;border-radius:15px;background:linear-gradient(180deg,#2a9a96,#17616a);border:2px solid #3a2410;box-shadow:inset 0 2px 4px rgba(0,0,0,.45);box-sizing:border-box\"><span style=\"position:absolute;top:5px;left:8px;font:800 10px 'Baloo 2';color:#fff4dc\">ON<\u002Fspan><div style=\"position:absolute;top:1px;left:32px;width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3c4 0,#e2b75a 40%,#8a6224 100%);border:1.5px solid #3a2410;box-sizing:border-box\"><\u002Fdiv><\u002Fdiv><div style=\"position:relative;width:62px;height:30px;border-radius:15px;background:#5a4632;border:2px solid #3a2410;box-shadow:inset 0 2px 4px rgba(0,0,0,.45);box-sizing:border-box\"><span style=\"position:absolute;top:5px;left:29px;font:800 10px 'Baloo 2';color:#fff4dc\">OFF<\u002Fspan><div style=\"position:absolute;top:1px;left:2px;width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3c4 0,#e2b75a 40%,#8a6224 100%);border:1.5px solid #3a2410;box-sizing:border-box\"><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"font-size:12px;line-height:1.45;color:#9a8466\">62×30. On = teal ocean fill, brass knob slides 30px in 150ms. Off = dark wood.<\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:10px\"><div style=\"font:700 13px 'Baloo 2';color:#e6d4b0\">Rope slider<\u002Fdiv><div style=\"padding:14px;border-radius:10px;background:#ecd6a4;box-shadow:inset 0 0 18px rgba(110,70,25,.4);min-height:44px;display:flex;align-items:center;gap:10px;flex-wrap:wrap\"><div style=\"position:relative;width:100%;height:14px;border-radius:7px;background:#3a2616;border:2px solid #4a300f;box-sizing:border-box\"><div style=\"position:absolute;left:0;top:0;bottom:0;width:60%;border-radius:5px;background:linear-gradient(180deg,#8fe0d6,#1f8a8c 60%,#17616a)\"><\u002Fdiv><div style=\"position:absolute;left:calc(60% - 13px);top:-8px;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3c4 0,#e2b75a 40%,#8a6224 100%);border:2px solid #3a2410;box-sizing:border-box\"><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"font-size:12px;line-height:1.45;color:#9a8466\">Track 14px, knob 26px (44px hit area). Tap or drag. Value in Baloo 800 at the right.<\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:10px\"><div style=\"font:700 13px 'Baloo 2';color:#e6d4b0\">Segmented<\u002Fdiv><div style=\"padding:14px;border-radius:10px;background:#ecd6a4;box-shadow:inset 0 0 18px rgba(110,70,25,.4);min-height:44px;display:flex;align-items:center;gap:10px;flex-wrap:wrap\"><div style=\"display:flex;padding:3px;gap:3px;border-radius:12px;background:#3a2616\"><div style=\"padding:4px 12px;border-radius:9px;font:800 13px 'Baloo 2';color:#d9c4a0\">Low<\u002Fdiv><div style=\"padding:4px 12px;border-radius:9px;font:800 13px 'Baloo 2';color:#d9c4a0\">Med<\u002Fdiv><div style=\"padding:4px 12px;border-radius:9px;background:linear-gradient(180deg,#f7de98,#c89a45);font:800 13px 'Baloo 2';color:#3a2410\">High<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"font-size:12px;line-height:1.45;color:#9a8466\">2–4 options. Active = brass pill; idle = parchment text on inked well.<\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:10px\"><div style=\"font:700 13px 'Baloo 2';color:#e6d4b0\">Tab rail<\u002Fdiv><div style=\"padding:14px;border-radius:10px;background:#ecd6a4;box-shadow:inset 0 0 18px rgba(110,70,25,.4);min-height:44px;display:flex;align-items:center;gap:10px;flex-wrap:wrap\"><div style=\"display:flex;flex-direction:column;gap:5px;width:100%;padding:8px;border-radius:8px;background:repeating-linear-gradient(178deg,#5b3920 0 2px,#6d452a 2px 7px,#63401f 7px 9px,#7a4e2e 9px 15px,#5f3b21 15px 17px)\"><div style=\"height:28px;padding:0 10px;display:flex;align-items:center;border-radius:8px;background:#ecd6a4;box-shadow:inset 3px 0 0 #c29444;font:800 13px 'Baloo 2';color:#3a2616\">Audio<\u002Fdiv><div style=\"height:28px;padding:0 10px;display:flex;align-items:center;border-radius:8px;background:rgba(0,0,0,.28);font:700 13px 'Baloo 2';color:#e6d4b0\">Graphics<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"font-size:12px;line-height:1.45;color:#9a8466\">Active tab is parchment and bleeds into the content page, so the page reads as pulled out of the frame.<\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:10px\"><div style=\"font:700 13px 'Baloo 2';color:#e6d4b0\">Dropdown<\u002Fdiv><div style=\"padding:14px;border-radius:10px;background:#ecd6a4;box-shadow:inset 0 0 18px rgba(110,70,25,.4);min-height:44px;display:flex;align-items:center;gap:10px;flex-wrap:wrap\"><div style=\"display:flex;align-items:center;gap:10px;height:32px;padding:0 12px;border-radius:10px;background:#f7e8c4;border:2px solid #8a6a3a;font:800 14px 'Baloo 2';color:#3a2616\">English <span style=\"font-size:10px;color:#8a6a3a\">▼<\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"font-size:12px;line-height:1.45;color:#9a8466\">Opens a parchment list sheet. Used for long option sets (language).<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:16px;font-size:13px;line-height:1.5;color:#b89a6a\">Settings has no coral CTA: every change applies instantly. Frame = wood with brass studs; content = parchment page; destructive links in brick red, never coral.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding:22px 24px;border-radius:14px;background:#211710;border:1px solid #3a2a1c;grid-column:1 / -1\">\n<div style=\"font-family:'Germania One',serif;font-size:24px;color:#f7dfa6;margin-bottom:16px\">Celebration scale<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px\">\n<div style=\"padding:14px 16px;border-radius:12px;background:#1a120c;border:1px solid #3a2a1c;border-top:4px solid #cdb690\"><div style=\"font-family:'Germania One',serif;font-size:22px;color:#f7dfa6;margin-bottom:8px\">Small<\u002Fdiv><div style=\"display:grid;grid-template-columns:78px 1fr;gap:8px;padding:5px 0;border-top:1px solid #2e2016;font-size:13px;line-height:1.4\"><span style=\"color:#9a8466;font-weight:700\">Where<\u002Fspan><span style=\"color:#e6d4b0\">in place, world keeps running<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:78px 1fr;gap:8px;padding:5px 0;border-top:1px solid #2e2016;font-size:13px;line-height:1.4\"><span style=\"color:#9a8466;font-weight:700\">Parts<\u002Fspan><span style=\"color:#e6d4b0\">number pop, pill bump + shine, toast<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:78px 1fr;gap:8px;padding:5px 0;border-top:1px solid #2e2016;font-size:13px;line-height:1.4\"><span style=\"color:#9a8466;font-weight:700\">Time<\u002Fspan><span style=\"color:#e6d4b0\">≤ 1s, never blocks input<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:78px 1fr;gap:8px;padding:5px 0;border-top:1px solid #2e2016;font-size:13px;line-height:1.4\"><span style=\"color:#9a8466;font-weight:700\">Feel<\u002Fspan><span style=\"color:#e6d4b0\">light tick haptic, coin clink<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:78px 1fr;gap:8px;padding:5px 0;border-top:1px solid #2e2016;font-size:13px;line-height:1.4\"><span style=\"color:#9a8466;font-weight:700\">Events<\u002Fspan><span style=\"color:#e6d4b0\">loot pickup, resource tick, bounty progress<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"padding:14px 16px;border-radius:12px;background:#1a120c;border:1px solid #3a2a1c;border-top:4px solid #f2c66d\"><div style=\"font-family:'Germania One',serif;font-size:22px;color:#f7dfa6;margin-bottom:8px\">Medium<\u002Fdiv><div style=\"display:grid;grid-template-columns:78px 1fr;gap:8px;padding:5px 0;border-top:1px solid #2e2016;font-size:13px;line-height:1.4\"><span style=\"color:#9a8466;font-weight:700\">Where<\u002Fspan><span style=\"color:#e6d4b0\">overlay on the live scene<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:78px 1fr;gap:8px;padding:5px 0;border-top:1px solid #2e2016;font-size:13px;line-height:1.4\"><span style=\"color:#9a8466;font-weight:700\">Parts<\u002Fspan><span style=\"color:#e6d4b0\">stamp or banner, flotsam, flash, one burst<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:78px 1fr;gap:8px;padding:5px 0;border-top:1px solid #2e2016;font-size:13px;line-height:1.4\"><span style=\"color:#9a8466;font-weight:700\">Time<\u002Fspan><span style=\"color:#e6d4b0\">1.5–2.5s, input stays live<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:78px 1fr;gap:8px;padding:5px 0;border-top:1px solid #2e2016;font-size:13px;line-height:1.4\"><span style=\"color:#9a8466;font-weight:700\">Feel<\u002Fspan><span style=\"color:#e6d4b0\">medium haptic, drum or cannon hit<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:78px 1fr;gap:8px;padding:5px 0;border-top:1px solid #2e2016;font-size:13px;line-height:1.4\"><span style=\"color:#9a8466;font-weight:700\">Events<\u002Fspan><span style=\"color:#e6d4b0\">ship sunk, ship upgrade, escalation, defeat (somber)<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"padding:14px 16px;border-radius:12px;background:#1a120c;border:1px solid #3a2a1c;border-top:4px solid #ffd6ae\"><div style=\"font-family:'Germania One',serif;font-size:22px;color:#f7dfa6;margin-bottom:8px\">Large<\u002Fdiv><div style=\"display:grid;grid-template-columns:78px 1fr;gap:8px;padding:5px 0;border-top:1px solid #2e2016;font-size:13px;line-height:1.4\"><span style=\"color:#9a8466;font-weight:700\">Where<\u002Fspan><span style=\"color:#e6d4b0\">full takeover, world dims<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:78px 1fr;gap:8px;padding:5px 0;border-top:1px solid #2e2016;font-size:13px;line-height:1.4\"><span style=\"color:#9a8466;font-weight:700\">Parts<\u002Fspan><span style=\"color:#e6d4b0\">rays, ring, confetti + coin rain, Higgins<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:78px 1fr;gap:8px;padding:5px 0;border-top:1px solid #2e2016;font-size:13px;line-height:1.4\"><span style=\"color:#9a8466;font-weight:700\">Time<\u002Fspan><span style=\"color:#e6d4b0\">3s+, waits for CTA<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:78px 1fr;gap:8px;padding:5px 0;border-top:1px solid #2e2016;font-size:13px;line-height:1.4\"><span style=\"color:#9a8466;font-weight:700\">Feel<\u002Fspan><span style=\"color:#e6d4b0\">heavy haptic, music sting<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:78px 1fr;gap:8px;padding:5px 0;border-top:1px solid #2e2016;font-size:13px;line-height:1.4\"><span style=\"color:#9a8466;font-weight:700\">Events<\u002Fspan><span style=\"color:#e6d4b0\">victory, island tier up, Epic/Legendary reveal<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:14px;font-size:13px;line-height:1.5;color:#b89a6a\">Queue rule: never stack two Large moments; the second waits until the first CTA is tapped. Reduce motion swaps rays, confetti and shake for a still glow and the same sounds.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding:22px 24px;border-radius:14px;background:#211710;border:1px solid #3a2a1c;grid-column:1 / -1\">\n<div style=\"font-family:'Germania One',serif;font-size:24px;color:#f7dfa6;margin-bottom:14px\">Godot build notes<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:18px;font-size:13px;line-height:1.55;color:#b89a6a\">\n<div><b style=\"color:#e6d4b0\">Theme resource<\u002Fb><br>One <span style=\"font-family:ui-monospace,monospace;color:#9fe3f0\">pirate_theme.tres<\u002Fspan>. Button variations: Primary, Brass, WoodRound. Colours above become theme constants.<\u002Fdiv>\n<div><b style=\"color:#e6d4b0\">Frames<\u002Fb><br>StyleBoxTexture from 3× painted PNGs. Parchment margins 40px, rope 12px, plaque 3-slice 32px ends. Axis stretch = tile for rope.<\u002Fdiv>\n<div><b style=\"color:#e6d4b0\">States<\u002Fb><br>Pressed = offset_top +4 and modulate 0.88. Glow = child TextureRect behind, driven by a looping AnimationPlayer. Only the screen's primary gets the glow node.<\u002Fdiv>\n<div><b style=\"color:#e6d4b0\">Juice<\u002Fb><br>Coin burst = GPUParticles2D, 14 particles, 0.8s, one-shot. Rays = rotating TextureRect + radial alpha mask. Fleet trail = Line2D with dashed texture, UV scroll.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showAnnotations&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;lootRarity&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;common&quot;,&quot;uncommon&quot;,&quot;rare&quot;,&quot;epic&quot;,&quot;legendary&quot;],&quot;default&quot;:&quot;legendary&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;notoriety&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0,&quot;max&quot;:800,&quot;step&quot;:1,&quot;default&quot;:212,&quot;tsType&quot;:&quot;number&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    sel: 0, tile: 2, chest: false, tip: 0,\n    ev: { sunk: true, vic: true, def: true, tier: true, esc: true },\n    lootGot: false, shipPhase: 0, capOpen: false,\n    st: { master: 80, music: 60, sfx: 90, dialogue: 100, ambient: 70, haptics: true, muteBg: true, quality: 'High', fps: '60', battery: false, weather: true, fpsCounter: false, textSize: 'M', cb: 'Off', reduceMotion: false, shake: true, leftHanded: false, subtitles: true, nFleet: true, nUpgrade: true, nDaily: false, nNews: true, quiet: '22:00–08:00' }\n  };\n  setSt(k, v) { this.setState(p => ({ st: Object.assign({}, p.st, { [k]: v }) })); }\n  replay(k) {\n    this.setState(p => ({ ev: Object.assign({}, p.ev, { [k]: false }) }), () => setTimeout(() => this.setState(p => ({ ev: Object.assign({}, p.ev, { [k]: true }) })), 40));\n  }\n  componentWillUnmount() { clearTimeout(this._t); }\n  renderVals() {\n    const RAR = {\n      common: { name: 'Common', col: '#EDE6D6', hi: '#fffaf0', dk: '#a89d86', glow: '0 3px 8px rgba(0,0,0,.5)' },\n      uncommon: { name: 'Uncommon', col: '#3FBF8F', hi: '#9ff0cc', dk: '#1d7a58', glow: '0 3px 8px rgba(0,0,0,.5)' },\n      rare: { name: 'Rare', col: '#2F6FD6', hi: '#8fb8ff', dk: '#173f8a', glow: '0 3px 8px rgba(0,0,0,.5)' },\n      epic: { name: 'Epic', col: '#7B3FC4', hi: '#c49bff', dk: '#45207a', glow: '0 0 14px rgba(160,100,240,.55)' },\n      legendary: { name: 'Legendary', col: '#FF8A3D', hi: '#ffe39a', dk: '#c2501a', glow: '0 0 22px rgba(255,150,70,.75)' }\n    };\n    const s = this.state;\n    const ann = this.props.showAnnotations ?? true;\n    const lr = RAR[this.props.lootRarity ?? 'legendary'] || RAR.legendary;\n\n    const B = [\n      [0, 1, 'Academy', 3, 'academy', 'Where Research gets done. Mind the ink.'],\n      [1, 0, 'LumberMill', 5, 'lumbermill', 'Produces Wood. Fully upgraded; the trees have filed a complaint.'],\n      [1, 1, 'Shipyard', 3, 'shipyard', 'Builds and refits your ships.'],\n      [1, 2, 'Market', 4, 'market', 'Where goods change hands, at prices Higgins calls fair-ish.'],\n      [2, 1, 'Watchtower', 2, 'watchtower', 'Keeps an eye on the waters around Port Royal.']\n    ];\n    const avg = B.reduce((x, y) => x + y[3], 0) / B.length;\n    const tierNow = Math.floor(avg);\n    const tiers = [1, 2, 3, 4, 5].map(n => {\n      const st = n < tierNow ? 'done' : n === tierNow ? 'cur' : 'lock';\n      return {\n        n, name: st === 'cur' ? 'Current' : n === tierNow + 1 ? 'Next' : '',\n        size: st === 'cur' ? '36px' : '28px', mt: st === 'cur' ? '-2px' : '2px',\n        bg: st === 'lock' ? '#2a1d12' : st === 'cur' ? 'radial-gradient(circle at 40% 35%,#fffbe0,#ffd97a 45%,#c29444)' : 'radial-gradient(circle at 40% 35%,#f7de98,#c29444)',\n        bd: st === 'lock' ? '#5a4632' : '#4a300f',\n        sh: st === 'cur' ? '0 0 16px 4px rgba(255,217,122,.7)' : st === 'done' ? '0 0 8px rgba(255,217,122,.35)' : 'none',\n        fg: st === 'lock' ? '#7a6650' : '#3a2410',\n        lc: st === 'cur' ? '#ffe9a8' : '#9a8466'\n      };\n    });\n    const tierLine = 'Tier ' + tierNow + ' = avg building Lv ' + avg.toFixed(1) + ' · Tier ' + (tierNow + 1) + ' at ' + (tierNow + 1) + '.0';\n    const tiles = B.map(([r, c, name, lvl, short], i) => {\n      const selected = s.tile === i;\n      return {\n        r, c, lvl, short,\n        x: (410 + (c - r) * 80 - 56) + 'px', y: (112 + (c + r) * 46 - (selected ? 2 : 0)) + 'px',\n        ring: selected ? 'linear-gradient(180deg,#fff0b8,#c29444)' : 'rgba(0,0,0,0)',\n        base: 'radial-gradient(circle at 40% 30%,#b8c77a,#6f9a4a 60%,#3f6a34)',\n        pick: () => this.setState({ tile: i })\n      };\n    }).sort((p, q) => (p.r + p.c) - (q.r + q.c));\n    const ct = B[s.tile];\n    const lv = ct[3];\n    const tile = lv >= 5\n      ? { name: ct[2], sub: 'Lv 5 · Max', desc: ct[5], chips: ['Island avg ' + avg.toFixed(1)], actionable: false, locked: true, cta: 'Max level' }\n      : { name: ct[2], sub: 'Lv ' + lv + ' → ' + (lv + 1), desc: ct[5], chips: [(lv * 1400).toLocaleString() + ' gold', (lv * 300) + ' wood', (lv * 120) + ' iron', 'Island avg ' + avg.toFixed(1) + ' → ' + (avg + 1 / B.length).toFixed(1)], actionable: true, locked: false, cta: 'Upgrade' };\n\n    const C = [\n      ['Anne', 'legendary', 'Patch & Pray', 'eyepatch, lopsided smirk', 38, [88, 72, 412, 3100, 64]],\n      ['Barnaby', 'epic', 'Grog Rally', 'barnacle beard, huge grin', 31, [64, 58, 356, 3600, 90]],\n      ['Yusuf', 'epic', 'Chain Shot', 'gold tooth, ear trumpet', 29, [58, 50, 398, 2800, 40]],\n      ['Isabel', 'rare', 'Steady Hands', 'duel scar, raised brow', 24, [102, 84, 288, 2200, 70]],\n      ['Tobias', 'uncommon', 'Tar & Timber', 'gap-tooth, fish on hat', 17, [120, 92, 190, 1400, 55]],\n      ['Mei', 'common', 'Lucky Pipe', 'spectacles, clay pipe', 12, [96, 66, 140, 1100, 35]]\n    ];\n    const k1 = n => n >= 1000 ? (n / 1000).toFixed(1) + 'k' : String(n);\n    const caps = C.map(([name, rk, ab, trait, lvl, x], i) => {\n      const r = RAR[rk];\n      const on = s.sel === i;\n      return {\n        name, trait, lvl, ability: 'Ability: ' + ab, dmg: x[2], hp: k1(x[3]), spd: x[0], col: r.col, hi: r.hi, dk: r.dk,\n        shadow: on ? '0 0 0 3px #fff0b8,0 0 0 5px #4a300f,' + r.glow : r.glow,\n        lift: on ? 'translateY(-3px)' : 'none',\n        pick: () => this.setState({ sel: i })\n      };\n    });\n    const SC = C[s.sel], SR = RAR[SC[1]], MX = [120, 100, 450, 4000, 100];\n    const sc = {\n      name: SC[0], rar: SR.name.toUpperCase(), lvl: SC[4], ability: 'Ability: ' + SC[2], trait: SC[3], col: SR.col, hi: SR.hi, dk: SR.dk, glow: SR.glow,\n      stats: ['Speed', 'Turn rate', 'Damage', 'Health', 'Boarding'].map((label, i) => ({ label, v: k1(SC[5][i]), w: Math.round(SC[5][i] / MX[i] * 100) + '%' }))\n    };\n\n    const noto = Math.max(0, Math.round(this.props.notoriety ?? 212));\n    const TH = [60, 150, 300, 500], POS = [20, 40, 60, 80];\n    const posOf = v => {\n      if (v >= 500) return Math.min(100, 80 + (v - 500) / 500 * 20);\n      let lo = 0, lp = 0;\n      for (let i = 0; i < 4; i++) { if (v < TH[i]) return lp + (v - lo) / (TH[i] - lo) * (POS[i] - lp); lo = TH[i]; lp = POS[i]; }\n      return 80;\n    };\n    const np = Math.max(posOf(noto), 2);\n    const nextTh = TH.find(t => t > noto);\n\n    const coins = Array.from({ length: 16 }, (_, i) => {\n      const gem = i % 4 === 3;\n      return {\n        a: -80 + (i * 160 / 15) + (i % 2 ? 6 : -6), s: (0.75 + ((i * 37) % 10) / 20).toFixed(2), d: (i % 5) * 0.04,\n        r: gem ? '0' : '50%', clip: gem ? 'polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)' : 'none',\n        bg: gem ? 'linear-gradient(135deg,' + lr.hi + ' 0 35%,' + lr.col + ' 35% 62%,' + lr.dk + ' 62%)' : 'radial-gradient(circle at 34% 30%,#fffbe0 0 10%,#ffd75e 28%,#e0a023 62%,#8a5a0c 100%)',\n        bd: gem ? 'none' : '1.5px solid #3e2604'\n      };\n    });\n    const confetti = Array.from({ length: 26 }, (_, i) => ({\n      x: ((i * 71) % 100) + '%', d: ((i * 13) % 17) / 10 + 's', dur: (2.4 + (i % 5) * 0.35) + 's',\n      w: (i % 3 === 0 ? 14 : 9) + 'px', hgt: (i % 3 === 0 ? 14 : 6) + 'px', r: i % 3 === 0 ? '50%' : '2px',\n      bg: i % 3 === 0 ? 'radial-gradient(circle at 34% 30%,#fffbe0 0 10%,#ffd75e 28%,#e0a023 62%,#8a5a0c 100%)' : ['#f4ead4', '#f2c66d', '#3a9a97', '#ecd6a4'][i % 4]\n    }));\n\n    const tips = [\n      \"See the big glowing button, Captain? That's the one that does things. Everything else is paperwork, and paperwork is my job.\",\n      \"Gold, Wood, Iron, Rum and Research. I count all five. Rum goes fastest. I don't ask.\",\n      \"Raid enough and Notoriety climbs. Cross 60 and bounty hunters take an interest. It only gets friendlier at 150, 300 and 500.\",\n      \"Every building levels to 5. An island's tier is the average of its buildings, so build evenly.\"\n    ];\n\n    const st = s.st;\n    const sv = {}, sl = {};\n    ['master', 'music', 'sfx', 'dialogue', 'ambient'].forEach(k => {\n      sv[k] = { w: st[k] + '%', knob: 'calc(' + st[k] + '% - 13px)', n: st[k] };\n      sl[k] = e => { const r = e.currentTarget.getBoundingClientRect(); this.setSt(k, Math.round(Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * 100)); };\n    });\n    const tg = {}, tog = {};\n    ['haptics', 'muteBg', 'battery', 'weather', 'fpsCounter', 'reduceMotion', 'shake', 'leftHanded', 'subtitles', 'nFleet', 'nUpgrade', 'nDaily', 'nNews'].forEach(k => {\n      const on = !!st[k];\n      tg[k] = { bg: on ? 'linear-gradient(180deg,#2a9a96,#17616a)' : '#5a4632', x: on ? '32px' : '2px', t: on ? 'ON' : 'OFF', tx: on ? '8px' : '29px' };\n      tog[k] = () => this.setSt(k, !st[k]);\n    });\n    const SEGS = { quality: ['Low', 'Medium', 'High'], fps: ['30', '60'], textSize: ['S', 'M', 'L'], cb: ['Off', 'Protan', 'Deutan', 'Tritan'], quiet: ['Off', '22:00–08:00', 'Custom'] };\n    const sg = {};\n    Object.keys(SEGS).forEach(k => {\n      sg[k] = SEGS[k].map(label => ({ label, bg: st[k] === label ? 'linear-gradient(180deg,#f7de98,#c89a45)' : 'rgba(0,0,0,0)', fg: st[k] === label ? '#3a2410' : '#d9c4a0', pick: () => this.setSt(k, label) }));\n    });\n    const facs = [['Spanish Empire', '#e8b830', '#9a2a1e', '◆'], ['Royal Navy', '#9cc8ec', '#1e3a6e', '▲'], ['Pirate Clans', '#1a1a1a', '#6e1c1c', '✖'], ['Merchant Guild', '#efe2c0', '#6b4428', '●'], ['Ghost Fleet', '#6fe6e6', '#0f5a5e', '◐'], ['Your Fleet', '#3a7ae0', '#3a3d42', '★']]\n      .map(f => ({ name: f[0], sail: f[1], hull: f[2], emb: st.cb === 'Off' ? '' : f[3] }));\n\n    const sp = s.shipPhase;\n    const sw = [\n      ['Ocean deep', '#0A2C33'], ['Sunset teal', '#1F6F76'], ['Shallows', '#3A9A97'], ['Horizon gold', '#F4C96E'],\n      ['Driftwood', '#6D452A'], ['Wood dark', '#2E1A0C'], ['Brass', '#C29444'], ['Brass light', '#F7DE98'],\n      ['Parchment', '#ECD6A4'], ['Ink', '#3A2616'], ['Coral hero', '#F0602A'], ['Coral bloom', '#FFD6AE']\n    ];\n\n    return {\n      ann, tiers, tierLine, tiles, tile, caps, sc,\n      chest: s.chest, chestClosed: !s.chest, coins, confetti,\n      ring: lr.col, ringOp: s.chest ? 1 : 0.35, rarName: lr.name.toUpperCase(),\n      headline: s.chest ? lr.name + ' Haul!' : 'Treasure Chest',\n      chestAnim: s.chest ? 'none' : 'breathe 1.6s ease-in-out infinite',\n      chestLabel: s.chest ? 'chest open, lid back, gold spilling over lip' : 'chest closed, lid creaking, breathing',\n      chestNote: s.chest ? 'rays spin 26s · burst 0.8s · list pops 450ms' : 'chest breathes 1.6s (squash + stretch)',\n      chestCta: s.chest ? 'Claim Loot' : 'Open Chest',\n      parrotLine: s.chest ? \"Now that's a haul.\" : 'Go on, Captain.',\n      openChest: () => this.setState({ chest: true }),\n      ctaChest: () => this.setState(p => ({ chest: !p.chest })),\n      tipText: tips[s.tip], tipCount: 'Tip ' + (s.tip + 1) + ' of ' + tips.length,\n      dots: tips.map((_, i) => ({ bg: i === s.tip ? '#6b4428' : 'rgba(107,68,40,.2)' })),\n      nextLabel: s.tip === tips.length - 1 ? 'Got it' : 'Next',\n      nextTip: () => this.setState(p => ({ tip: (p.tip + 1) % tips.length })),\n      noto, notoNext: nextTh ? 'Next escalation: ' + nextTh : 'Top escalation reached',\n      notoPct: np + '%', notoBg: (10000 / np) + '%', notoSkull: 'calc(' + np + '% - 15px)',\n      notoMarks: TH.map((v, i) => ({ v, left: POS[i] + '%', col: noto >= v ? '#ff8a5a' : '#cdb690' })),\n      sv, sl, tg, tog, sg, facs,\n      lootGold: s.lootGot ? '27,260' : '24,860',\n      shipSub: sp === 2 ? 'Upgraded · Lv 4' : sp === 1 ? 'Refitting…' : 'Lv 3 → Lv 4',\n      shipStats: [['Health', '1,400', '1,650'], ['Speed', '120', '126'], ['Turn rate', '92', '95'], ['Damage', '190', '214']].map(r => ({ label: r[0], from: sp === 2 ? '' : r[1], to: sp === 2 ? r[2] : '→ ' + r[2], dc: sp === 2 ? '#1d7a58' : '#8a6a3a' })),\n      capTitle: s.capOpen ? 'Isabel joins!' : 'New Captain',\n      ev: s.ev,\n      replaySunk: () => this.replay('sunk'), replayVic: () => this.replay('vic'), replayDef: () => this.replay('def'),\n      replayTier: () => this.replay('tier'), replayEsc: () => this.replay('esc'),\n      lootGot: s.lootGot, lootIdle: !s.lootGot,\n      collectLoot: () => this.setState({ lootGot: true }),\n      replayLoot: () => this.setState({ lootGot: false }),\n      ship0: sp === 0, ship1: sp === 1, ship2: sp === 2,\n      startUpgrade: () => { this.setState({ shipPhase: 1 }); clearTimeout(this._t); this._t = setTimeout(() => this.setState({ shipPhase: 2 }), 1900); },\n      resetShip: () => { clearTimeout(this._t); this.setState({ shipPhase: 0 }); },\n      capOpen: s.capOpen, capClosed: !s.capOpen,\n      flipCap: () => this.setState({ capOpen: true }), resetCap: () => this.setState({ capOpen: false }),\n      swatches: sw.map(([n, hx]) => ({ n, h: hx, c: hx })),\n      rarities: ['common', 'uncommon', 'rare', 'epic', 'legendary'].map(k => RAR[k]),\n      motion: [\n        { a: 'Primary CTA glow', b: '2.2s sine loop', c: 'opacity .45→1, scale .96→1.07' },\n        { a: 'Button press', b: '60ms / 120ms', c: 'y +4px, lip 6→2px, 88% bright' },\n        { a: 'Chest breathe', b: '1.6s loop', c: 'squash 1.035×.975, lid creak SFX on beat' },\n        { a: 'Chest open', b: '0.8s burst', c: '16 coins + rarity sparkles fan 160°, rays spin 26s' },\n        { a: 'Portrait idle', b: 'blink 120ms / 4–6s', c: 'smirk frame on select' },\n        { a: 'Fleet trail', b: '1s linear loop', c: 'dash offset −24px (UV scroll)' },\n        { a: 'Resource pill', b: '400ms on change', c: 'shine sweep L→R, number ticks up' },\n        { a: 'Tutorial card', b: '450ms pop', c: 'text types ~30 cps, tap to finish' }\n      ]\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
