<?xml version="1.0"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" style="width:100%; height:auto; display:block; border-radius:4px;" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#8b8a7c"></stop>
        <stop offset="60%" stop-color="#6b6455"></stop>
        <stop offset="100%" stop-color="#4a4235"></stop>
      </linearGradient>
      <radialGradient id="vignette" cx="42%" cy="35%" r="75%">
        <stop offset="50%" stop-color="#000000" stop-opacity="0"></stop>
        <stop offset="100%" stop-color="#000000" stop-opacity="0.5"></stop>
      </radialGradient>
      <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
